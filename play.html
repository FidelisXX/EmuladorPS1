<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111318">
  <title>PS1 Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="play">
  <a class="voltar" href="index.html">&larr; Jogos</a>
  <div id="game"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="nuvem.js"></script>
  <script src="biblioteca.js"></script>
  <script>
    // Sincroniza memory card e save state com o Supabase (só quando logado)
    function ligarSavesNaNuvem(jogo) {
      const MEMCARD = "memcard.srm";
      const ESTADO = "estado.state";
      const mensagem = (texto) => window.EJS_emulator && window.EJS_emulator.displayMessage(texto);
      let ultimoCartao = null;
      let enviandoCartao = false;

      const iguais = (a, b) => a && b && a.length === b.length && a.every((v, i) => v === b[i]);

      // Salvamento automático do memory card a cada 30 s (o padrão do EmulatorJS é 5 min)
      window.EJS_defaultOptions = Object.assign({}, window.EJS_defaultOptions, { "save-save-interval": "30" });

      window.EJS_onGameStart = async () => {
        const emu = window.EJS_emulator;
        const gm = emu.gameManager;

        // Ao abrir: o memory card da nuvem substitui o do navegador
        try {
          const cartao = await Nuvem.baixar(jogo, MEMCARD);
          if (cartao) {
            const p = gm.getSaveFilePath();
            try { gm.FS.unlink(p); } catch {}
            gm.FS.writeFile(p, cartao);
            gm.loadSaveFiles();
            ultimoCartao = cartao;
            mensagem("☁ Save da nuvem carregado");
          }
        } catch (err) {
          console.error(err);
          mensagem("☁ Erro ao baixar o save da nuvem");
        }

        // Sempre que o EmulatorJS grava o memory card, envia se mudou
        emu.on("saveSaveFiles", async (dados) => {
          if (!dados || enviandoCartao || iguais(dados, ultimoCartao)) return;
          enviandoCartao = true;
          const copia = dados.slice();
          try {
            await Nuvem.enviar(jogo, MEMCARD, copia);
            ultimoCartao = copia;
          } catch (err) {
            console.error(err);
            mensagem("☁ Erro ao enviar o save para a nuvem");
          } finally {
            enviandoCartao = false;
          }
        });

        // Ao sair da aba ou trocar de app no celular, força um salvamento
        document.addEventListener("visibilitychange", () => {
          if (document.hidden && emu.started) gm.saveSaveFiles();
        });
      };

      // Botões "Salvar/Carregar estado" passam a usar a nuvem
      window.EJS_onSaveState = async ({ state }) => {
        mensagem("☁ Salvando estado na nuvem…");
        try {
          await Nuvem.enviar(jogo, ESTADO, state);
          mensagem("☁ Estado salvo na nuvem");
        } catch (err) {
          console.error(err);
          mensagem("☁ Erro ao salvar o estado na nuvem");
        }
      };

      window.EJS_onLoadState = async () => {
        try {
          const estado = await Nuvem.baixar(jogo, ESTADO);
          if (!estado) return mensagem("☁ Nenhum estado salvo na nuvem");
          window.EJS_emulator.gameManager.loadState(estado);
          mensagem("☁ Estado carregado da nuvem");
        } catch (err) {
          console.error(err);
          mensagem("☁ Erro ao carregar o estado da nuvem");
        }
      };
    }
  </script>
  <script>
    (async () => {
      const p = new URLSearchParams(location.search);
      const jogo = p.get("game");
      if (!jogo) return (location.href = "index.html");

      // Configuração do EmulatorJS (https://emulatorjs.org/docs)
      window.EJS_player = "#game";
      window.EJS_core = "psx";          // pcsx_rearmed (roda sem BIOS via HLE)
      window.EJS_gameName = jogo.replace(/\.[^.]+$/, "");
      window.EJS_language = "pt-BR";
      window.EJS_color = "#4f6bed";
      window.EJS_startOnLoaded = true;
      window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
      // Em telas de toque, liga o controle virtual do EmulatorJS
      if (matchMedia("(pointer: coarse)").matches) {
        window.EJS_defaultOptions = { "virtual-gamepad": "enabled" };
      }

      if (p.get("fonte") === "local") {
        // Jogo salvo no navegador: o EmulatorJS aceita o arquivo direto
        const arquivo = await Biblioteca.obter(jogo).catch(() => null);
        if (!arquivo) {
          alert("Jogo não encontrado neste navegador. Envie-o novamente.");
          return (location.href = "index.html");
        }
        window.EJS_gameUrl = arquivo;
      } else {
        window.EJS_gameUrl = "roms/" + encodeURIComponent(jogo);
        if (p.get("bios")) window.EJS_biosUrl = "bios/" + encodeURIComponent(p.get("bios"));
      }

      if (await Nuvem.usuario()) ligarSavesNaNuvem(jogo);

      document.title = window.EJS_gameName + " - PS1 Web";
      const loader = document.createElement("script");
      loader.src = window.EJS_pathtodata + "loader.js";
      document.body.appendChild(loader);
    })();
  </script>
</body>
</html>
