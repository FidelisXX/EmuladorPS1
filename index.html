<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PS1 Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>PS1 Web</h1>
    <p id="descricao" class="sub"></p>

    <section id="conta" class="conta" hidden>
      <form id="login" hidden>
        <span>Salve seu progresso na nuvem e continue em outro aparelho:</span>
        <div class="login-linha">
          <input id="email" type="email" placeholder="seu@email.com" required autocomplete="email">
          <button class="botao" type="submit">Entrar</button>
        </div>
      </form>
      <div id="logado" hidden>
        <span>☁ Saves na nuvem: <strong id="email-logado"></strong></span>
        <button id="sair" type="button" class="link">Sair</button>
      </div>
    </section>

    <div class="acoes">
      <label id="bios-campo" class="bios" hidden>
        BIOS:
        <select id="bios"><option value="">Nenhuma (HLE)</option></select>
      </label>
      <label class="botao">
        + Enviar jogo
        <input id="arquivo" type="file" multiple hidden>
      </label>
    </div>

    <div id="envio" class="envio" hidden>
      <div class="envio-topo"><span id="envio-nome"></span><span id="envio-pct"></span></div>
      <progress id="envio-barra" max="100" value="0"></progress>
      <button id="envio-cancelar" type="button" class="link">Cancelar</button>
    </div>
    <p id="aviso" class="sub" hidden></p>

    <ul id="jogos"></ul>
    <p id="vazio" class="sub" hidden>Nenhum jogo ainda. Use “+ Enviar jogo”.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="nuvem.js"></script>
  <script src="biblioteca.js"></script>
  <script>
    // Login para saves na nuvem (Supabase)
    function mostrarConta(usuario) {
      document.getElementById("conta").hidden = !Nuvem.disponivel;
      document.getElementById("login").hidden = !!usuario;
      document.getElementById("logado").hidden = !usuario;
      document.getElementById("email-logado").textContent = usuario ? usuario.email : "";
    }
    Nuvem.usuario().then(mostrarConta);
    Nuvem.aoMudarLogin(mostrarConta);

    document.getElementById("login").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const { error } = await Nuvem.entrar(email);
      mostrarAviso(error ? "Não foi possível enviar o link: " + error.message
        : `Enviamos um link para ${email}. Abra-o neste aparelho para entrar.`, !!error);
    });
    document.getElementById("sair").onclick = () => Nuvem.sair();
  </script>
  <script>
    const ROM_EXT = [".chd", ".pbp", ".iso", ".bin", ".img", ".zip", ".7z"];
    const biosSel = document.getElementById("bios");
    const lista = document.getElementById("jogos");
    const aviso = document.getElementById("aviso");
    const inputArquivo = document.getElementById("arquivo");
    inputArquivo.accept = ROM_EXT.join(",");

    // "servidor": server.js rodando (PC/celular na rede). "local": sem servidor (Vercel), jogos no navegador.
    let modo = "local";
    let precisaPin = false;

    function mostrarAviso(msg, erro) {
      aviso.textContent = msg;
      aviso.className = erro ? "erro" : "sub";
      aviso.hidden = !msg;
    }

    function tamanhoLegivel(bytes) {
      return bytes >= 1e9 ? (bytes / 1e9).toFixed(1) + " GB" : Math.round(bytes / 1e6) + " MB";
    }

    // PIN só é pedido no modo celular; fica guardado até fechar a aba
    function obterPin(forcar) {
      if (!precisaPin) return null;
      let pin = sessionStorage.getItem("pin");
      if (!pin || forcar) {
        pin = prompt("Digite o PIN mostrado na janela do servidor:");
        if (pin) sessionStorage.setItem("pin", pin.trim());
      }
      return sessionStorage.getItem("pin");
    }

    async function detectarModo() {
      try {
        const r = await fetch("/api/info");
        if (r.ok && (r.headers.get("content-type") || "").includes("json")) {
          const info = await r.json();
          modo = "servidor";
          precisaPin = info.pin;
        }
      } catch {}

      document.getElementById("descricao").innerHTML = modo === "servidor"
        ? "Envie jogos pelo botão abaixo ou coloque-os em <code>roms/</code>. A BIOS (opcional) vai em <code>bios/</code>."
        : "Os jogos ficam salvos <strong>só neste navegador</strong>, neste aparelho. Nada é enviado para a internet.";

      if (modo === "servidor") {
        document.getElementById("bios-campo").hidden = false;
        const arquivos = await fetch("/api/bios").then((r) => r.json());
        for (const f of arquivos) biosSel.add(new Option(f, f));
        const salva = localStorage.getItem("bios");
        if (salva && arquivos.includes(salva)) biosSel.value = salva;
        else if (arquivos.length) biosSel.value = arquivos[0];
      }
    }
    biosSel.addEventListener("change", () => localStorage.setItem("bios", biosSel.value));

    async function carregarJogos() {
      let arquivos = [];
      try {
        arquivos = modo === "servidor" ? await fetch("/api/roms").then((r) => r.json()) : await Biblioteca.listar();
      } catch {
        mostrarAviso("Não foi possível carregar a lista de jogos.", true);
      }
      lista.replaceChildren();
      document.getElementById("vazio").hidden = arquivos.length > 0;
      for (const f of arquivos) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = f.replace(/\.[^.]+$/, "");
        a.href = "#";
        a.onclick = (e) => {
          e.preventDefault();
          const p = new URLSearchParams({ game: f, fonte: modo });
          if (modo === "servidor" && biosSel.value) p.set("bios", biosSel.value);
          location.href = "play.html?" + p;
        };
        const excluir = document.createElement("button");
        excluir.type = "button";
        excluir.className = "excluir";
        excluir.textContent = "Excluir";
        excluir.onclick = () => excluirJogo(f);
        li.append(a, excluir);
        lista.appendChild(li);
      }
    }

    async function excluirJogo(nome) {
      const onde = modo === "servidor" ? "da pasta roms" : "deste navegador";
      if (!confirm(`Excluir "${nome}"?\nO jogo será apagado ${onde}.`)) return;

      if (modo === "local") {
        await Biblioteca.excluir(nome);
        mostrarAviso(`"${nome}" excluído.`);
        return carregarJogos();
      }

      for (let tentativa = 0; tentativa < 2; tentativa++) {
        const headers = {};
        const pin = obterPin(tentativa > 0);
        if (precisaPin && !pin) return;
        if (pin) headers["X-PIN"] = pin;
        const r = await fetch("/api/roms/" + encodeURIComponent(nome), { method: "DELETE", headers });
        if (r.status === 401) { sessionStorage.removeItem("pin"); continue; }
        mostrarAviso(r.ok ? `"${nome}" excluído.` : await r.text(), !r.ok);
        return carregarJogos();
      }
      mostrarAviso("PIN incorreto.", true);
    }

    // Envio para o servidor com XMLHttpRequest para ter barra de progresso
    let envioAtual = null;
    document.getElementById("envio-cancelar").onclick = () => envioAtual && envioAtual.abort();

    function mostrarEnvio(nome, texto) {
      document.getElementById("envio-nome").textContent = nome;
      document.getElementById("envio-pct").textContent = texto;
      document.getElementById("envio").hidden = false;
    }

    function enviarParaServidor(arquivo, pin) {
      return new Promise((resolve) => {
        const xhr = new XMLHttpRequest();
        envioAtual = xhr;
        const barra = document.getElementById("envio-barra");
        barra.value = 0;
        document.getElementById("envio-cancelar").hidden = false;
        mostrarEnvio(arquivo.name, "0%");

        xhr.upload.onprogress = (e) => {
          if (!e.lengthComputable) return;
          const p = Math.floor((e.loaded / e.total) * 100);
          barra.value = p;
          document.getElementById("envio-pct").textContent = p + "%";
        };
        xhr.onload = () => resolve({ status: xhr.status, texto: xhr.responseText });
        xhr.onerror = () => resolve({ status: 0, texto: "Falha de conexão durante o envio." });
        xhr.onabort = () => resolve({ status: -1, texto: "Envio cancelado." });
        xhr.open("PUT", "/api/roms/" + encodeURIComponent(arquivo.name));
        if (pin) xhr.setRequestHeader("X-PIN", pin);
        xhr.send(arquivo);
      });
    }

    async function salvarNoNavegador(arquivo) {
      envioAtual = {};
      document.getElementById("envio-barra").removeAttribute("value"); // barra animada, sem %
      document.getElementById("envio-cancelar").hidden = true;
      mostrarEnvio(arquivo.name, "Salvando " + tamanhoLegivel(arquivo.size) + "…");
      try {
        await Biblioteca.salvar(arquivo);
        return { status: 201 };
      } catch (err) {
        const texto = err && err.name === "ConstraintError" ? "Já existe um jogo com esse nome."
          : err && err.name === "QuotaExceededError" ? "Sem espaço no navegador para este jogo."
          : "Não foi possível salvar: " + (err && err.message);
        return { status: 500, texto };
      }
    }

    async function enviarParaServidorComPin(arquivo) {
      let r;
      for (let tentativa = 0; tentativa < 2; tentativa++) {
        const pin = obterPin(tentativa > 0);
        if (precisaPin && !pin) return { status: -1, texto: "Envio cancelado." };
        r = await enviarParaServidor(arquivo, pin);
        if (r.status !== 401) break;
        sessionStorage.removeItem("pin");
      }
      return r;
    }

    inputArquivo.addEventListener("change", async () => {
      const arquivos = [...inputArquivo.files];
      inputArquivo.value = "";
      mostrarAviso("");
      const enviados = [];

      for (const arquivo of arquivos) {
        const ext = arquivo.name.slice(arquivo.name.lastIndexOf(".")).toLowerCase();
        if (!ROM_EXT.includes(ext)) {
          mostrarAviso(`"${arquivo.name}": formato não aceito. Use ${ROM_EXT.join(", ")}.`, true);
          continue;
        }
        const r = modo === "servidor" ? await enviarParaServidorComPin(arquivo) : await salvarNoNavegador(arquivo);
        if (r.status >= 200 && r.status < 300) enviados.push(arquivo.name);
        else { mostrarAviso(`"${arquivo.name}": ${r.texto}`, true); if (r.status === -1) break; }
      }

      envioAtual = null;
      document.getElementById("envio").hidden = true;
      if (enviados.length && aviso.hidden) mostrarAviso(`Enviado: ${enviados.join(", ")}`);
      carregarJogos();
    });

    // Evita fechar a aba no meio de um envio
    window.addEventListener("beforeunload", (e) => { if (envioAtual) e.preventDefault(); });

    detectarModo().then(carregarJogos);
  </script>
</body>
</html>
